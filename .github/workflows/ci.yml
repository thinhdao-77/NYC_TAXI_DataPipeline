name: CI

# Chạy theo push trên mọi nhánh (không dùng pull_request): PR do workflow auto-pr.yml tạo
# bằng GITHUB_TOKEN không kích hoạt sự kiện pull_request. Kết quả CI gắn với commit nên
# vẫn hiện trên PR.
on:
  push:
    branches: ['**']

# Push liên tiếp lên cùng nhánh thì hủy lượt chạy cũ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dbt.txt

      - name: Python syntax check
        run: python -m compileall -q tests mage sql powerbi

      - name: Docker Compose config
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: dbt parse
        working-directory: dbt
        # dbt parse không mở file DuckDB; trỏ đường dẫn vào thư mục tạm của runner.
        env:
          DUCKDB_PATH: ${{ runner.temp }}/ci.duckdb
          DUCKDB_TEMP_DIR: ${{ runner.temp }}/duckdb_tmp
        run: dbt parse --profiles-dir .
