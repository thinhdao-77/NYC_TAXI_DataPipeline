name: Auto PR

# Push một nhánh khác main -> tự mở PR vào main nếu nhánh đó chưa có PR đang mở.
# Xóa nhánh sau khi merge do cài đặt repo "Automatically delete head branches" đảm nhiệm.
#
# Yêu cầu cài đặt repo (Settings -> Actions -> General -> Workflow permissions):
#   "Allow GitHub Actions to create and approve pull requests" phải được bật.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    # Bỏ qua sự kiện xóa nhánh (push với deleted = true).
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Mở PR vào main nếu chưa có
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          open_prs=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq 'length')
          if [ "$open_prs" -gt 0 ]; then
            echo "Nhánh $BRANCH đã có PR đang mở, không tạo thêm."
            exit 0
          fi

          ahead=$(gh api "repos/$REPO/compare/main...$SHA" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "Nhánh $BRANCH không có commit nào mới so với main, không tạo PR."
            exit 0
          fi

          title=$(printf '%s\n' "$COMMIT_MSG" | head -n 1)
          [ -n "$title" ] || title="$BRANCH"

          commits=$(gh api "repos/$REPO/compare/main...$SHA" \
            --jq '.commits[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"')

          body=$(printf '%s\n\n%s\n\n%s\n%s\n' \
            "PR tự động tạo khi push nhánh \`$BRANCH\` ($ahead commit mới so với \`main\`)." \
            "Trước khi merge: kiểm tra CI, tab *Files changed* và cập nhật \`docs/PROJECT_STATUS.md\`. Nhánh sẽ tự xóa sau khi merge." \
            "**Commit:**" \
            "$commits")

          gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body "$body"
